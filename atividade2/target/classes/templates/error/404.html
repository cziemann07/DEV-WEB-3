<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            font-family: Arial, Helvetica, sans-serif;
            color: #202124;
            background: #f5f7fb;
        }

        main {
            width: min(760px, 100%);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 5vw, 4rem);
        }

        p {
            margin: 0 0 24px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .video {
            width: 100%;
            aspect-ratio: 16 / 9;
            margin: 0 auto 24px;
            overflow: hidden;
            border: 1px solid #d6dbe6;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 18px 40px rgba(32, 33, 36, 0.14);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        a {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 6px;
            color: #fff;
            background: #1a73e8;
            text-decoration: none;
            font-weight: 700;
        }

        a:hover,
        a:focus {
            background: #1558b0;
        }
    </style>
</head>
<body>
    <main>
        <h1>Erro 404</h1>
        <p>A página que você tentou acessar não foi encontrada, professor.</p>

        <div class="video" aria-label="Surpresa">
            <iframe
                src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ"
                title="erro 404"
                loading="lazy"
                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>
        </div>

        <a href="/">Voltar para a página inicial</a>
    </main>
</body>
</html>
