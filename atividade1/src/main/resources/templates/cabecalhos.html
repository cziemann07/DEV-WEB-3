<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cabecalhos</title>
</head>
<body>
    <h1>Cabeçalhos da requisição! ROCK</h1>
    <p>host: <span th:text="${host}"></span></p>
    <p>user-agent: <span th:text="${userAgent}"></span></p>
    <p>accept-encoding: <span th:text="${acceptEncoding}"></span></p>
    <p>accept-language: <span th:text="${acceptLanguage}"></span></p>
</body>
</html>
